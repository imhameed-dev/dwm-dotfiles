[colors]
background = #1e1e1e
foreground = #dcdcdc
accent = #df6124
muted = #888888

[bar/main]
width = 54%
height = ${env:DWM_POLYBAR_HEIGHT}
offset-x = 23%
offset-y = ${env:DWM_POLYBAR_TOP_GAP:8}
radius = 16
enable-struts = false
override-redirect = true
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrains Mono:size=9;2
padding-left = 4
padding-right = 2
module-margin = 2
modules-left = date windowtitle
modules-center = workspaces
modules-right = tray wlan volume battery

[module/date]
type = internal/date
interval = 1
time = %H:%M
date = %a, %b %d
label = %{F#df6124}%time%%{F-} %{F#888888}%date%%{F-}

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/dwm-workspaces.sh
interval = 0.25
format = <output>

[module/tray]
type = internal/tray
tray-spacing = 8
tray-background = ${colors.background}

[module/wlan]
type = internal/network
interface = ${env:DWM_WIFI_INTERFACE:lo}
interval = 3
format-connected = <label-connected>
label-connected = %essid:0:18:...%
format-disconnected = <label-disconnected>
label-disconnected = disconnected
label-disconnected-foreground = ${colors.muted}

[module/volume]
type = internal/pulseaudio
interval = 2
format-volume = <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
label-muted = muted
label-muted-foreground = ${colors.muted}

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/dwm-battery.sh
interval = 10
format = <output>
label = %output%

[module/windowtitle]
type = custom/script
exec = ~/.config/polybar/scripts/dwm-windowtitle.py
tail = true
