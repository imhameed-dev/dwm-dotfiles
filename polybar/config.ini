[colors]
background = #1e1e1e
foreground = #dcdcdc
accent = #df6124
muted = #888888

[bar/main]
width = 60%
height = 34
offset-x = 20%
offset-y = 8
radius = 16
enable-struts = false
override-redirect = true
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font:size=10;2"
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
modules-left = date appname workspaces tray wifi volume battery

[module/date]
type = internal/date
interval = 10
time = %I:%M %p
date = %a, %b %d
label = %{F#df6124}%time%%{F-} %{F#888888}%date%%{F-}

; Focused app name (WM_CLASS). Event-driven tail script, see appname.sh; native xwindow can only show the title.
[module/appname]
type = custom/script
exec = sh ~/.config/polybar/appname.sh
tail = true
label = %output%
label-minlen = 12
label-maxlen = 12

; Tags 1-5. dwm publishes _NET_CURRENT_DESKTOP / _NET_DESKTOP_NAMES (see dwm.c setup()).
; dwm ignores workspace click/scroll requests, so both are off.
[module/workspaces]
type = internal/xworkspaces
enable-click = false
enable-scroll = false
label-active = %name%
label-active-foreground = ${colors.background}
label-active-background = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.muted}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.accent}
label-urgent-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 5
tray-padding = 0
tray-background = ${colors.background}

; Polybar >= 3.6 finds the Wi-Fi interface itself. On older versions add: interface = <name>
[module/wifi]
type = internal/network
interface-type = wireless
interval = 10
format-connected = <label-connected>
label-connected =  %essid%
format-disconnected = <label-disconnected>
label-disconnected = disconnected

; Event-driven via libpulse (works with pipewire-pulse). "interval" is the scroll step in %, not a poll rate.
[module/volume]
type = internal/pulseaudio
interval = 5
format-volume = <ramp-volume>  <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
label-muted =   %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle

; This laptop: battery BAT1, adapter ACAD (see /sys/class/power_supply).
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 30
format-charging =   <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
format-full = <ramp-capacity>  <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
