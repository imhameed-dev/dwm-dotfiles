name: Validate

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and shell-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxft-dev libxinerama-dev shellcheck
      - name: Shell syntax and ShellCheck
        run: |
          scripts="install.sh .autostart.sh .xinitrc .bash_profile polybar/appname.sh rofi/scripts/powermenu.sh rofi/scripts/wallpaper-menu.sh"
          for f in $scripts; do bash -n "$f"; done
          shellcheck $scripts
      - name: Installer dry run
        run: |
          ./install.sh --help
          ./install.sh --dry-run
      - name: Build DWM
        run: |
          make clean
          make
          make clean
      - name: Repository rules
        run: |
          git diff --check
          test -f wallpapers/wallpaper.jpg
          test ! -e polybar/scripts
          ! grep -nE 'while true|sleep [0-9]' .autostart.sh .xinitrc
          ! grep -RIn -E '/home/' .autostart.sh .xinitrc polybar picom dunst
          ! grep -RIn -E 'python|xdotool' .autostart.sh .xinitrc install.sh polybar
