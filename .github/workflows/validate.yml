name: Validate

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and shell-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxft-dev libxinerama-dev shellcheck imagemagick libnotify-bin
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n .dwm-autostart.sh
          bash -n .xinitrc
          bash -n .bash_profile
          bash -n polybar/scripts/dwm-workspaces.sh
          bash -n polybar/scripts/dwm-battery.sh
          bash -n rofi/scripts/powermenu.sh
          bash -n rofi/scripts/wallpaper-menu.sh
      - name: ShellCheck
        run: |
          shellcheck install.sh .dwm-autostart.sh .xinitrc .bash_profile \
            polybar/scripts/dwm-workspaces.sh polybar/scripts/dwm-battery.sh \
            rofi/scripts/powermenu.sh rofi/scripts/wallpaper-menu.sh
      - name: Installer checks
        run: |
          ./install.sh --help
          ./install.sh --dry-run
      - name: Build DWM
        run: |
          make clean
          make
      - name: Clean build outputs
        run: make clean
      - name: Repository checks
        run: |
          git diff --check
          test -f X11/40-libinput.conf
          test ! -d x11
          test -d wallpapers
          test -f wallpapers/wallpaper.jpg
          test -x rofi/scripts/wallpaper-menu.sh
          test -x rofi/scripts/powermenu.sh
          test -x polybar/scripts/dwm-workspaces.sh
          test -x polybar/scripts/dwm-battery.sh
          test -x polybar/scripts/dwm-windowtitle.py
          grep -q 'XK_w, spawn' dwm/config.h
          grep -q 'wallpapermenucmd' dwm/config.h
          grep -q 'browsercmd' dwm/config.h
          grep -q 'XK_e, spawn' dwm/config.h
          grep -q 'autostartcmd' dwm/config.h
          grep -q '#include "polybar-height.h"' dwm/config.h
          grep -q 'polybargap = POLYBAR_RESERVED_HEIGHT' dwm/config.h
          grep -q 'height = ${env:DWM_POLYBAR_HEIGHT}' polybar/config.ini
          grep -q 'offset-y = ${env:DWM_POLYBAR_TOP_GAP:8}' polybar/config.ini
          grep -q 'setenv("DWM_POLYBAR_HEIGHT"' dwm/dwm.c
          grep -q 'setenv("DWM_POLYBAR_TOP_GAP"' dwm/dwm.c
          grep -q 'setenv("DWM_POLYBAR_BOTTOM_GAP"' dwm/dwm.c
          grep -Eq '^#define[[:space:]]+POLYBAR_HEIGHT[[:space:]]+[0-9]+$' dwm/polybar-height.h
          grep -Eq '^#define[[:space:]]+POLYBAR_TOP_GAP[[:space:]]+[0-9]+$' dwm/polybar-height.h
          grep -Eq '^#define[[:space:]]+POLYBAR_BOTTOM_GAP[[:space:]]+[0-9]+$' dwm/polybar-height.h
          ! grep -RIn --exclude-dir=.git --exclude-dir=.github -E 'debian-dwm-dotfiles|/usr/X11R6|wlp2s0|BAT1|ACAD' .
          ! find . -type f \( -name '*.o' -o -name 'dwm' \) -print -quit | grep -q .
