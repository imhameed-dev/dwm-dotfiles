name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and shell-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxft-dev libxinerama-dev shellcheck
      - name: Shell syntax and ShellCheck
        run: |
          scripts="install.sh .autostart.sh .xinitrc .bash_profile rofi/scripts/powermenu.sh rofi/scripts/wallpaper-menu.sh"
          for f in $scripts; do bash -n "$f"; done
          shellcheck $scripts
      - name: Installer dry run
        run: |
          ./install.sh --help
          ./install.sh --dry-run
      - name: Build dwm and dwmblocks
        run: |
          make clean
          make
          make clean
      - name: Repository rules
        run: |
          git diff --check
          test -f wallpapers/wallpaper.jpg
          ! grep -nE 'while true|sleep [0-9]' .autostart.sh .xinitrc || exit 1
          ! grep -RIn --exclude-dir=.git --exclude-dir=.github -E '/home/[a-zA-Z0-9_-]+' . || exit 1
          ! grep -RIn -E 'python|xdotool' .autostart.sh .xinitrc install.sh || exit 1
