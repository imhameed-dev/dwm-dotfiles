[window]
opacity = 0.92
padding = { x = 12, y = 10 }
decorations = "none"
dynamic_padding = true

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[colors.primary]
background = "#14141a"
foreground = "#e8e8e8"

[colors.cursor]
text = "#14141a"
cursor = "#4a9eff"

[colors.normal]
black   = "#1a1a1a"
red     = "#ff5c57"
green   = "#5af78e"
yellow  = "#f3f99d"
blue    = "#4a9eff"
magenta = "#ff6ac1"
cyan    = "#9aedfe"
white   = "#e8e8e8"

[colors.bright]
black   = "#686868"
red     = "#ff5c57"
green   = "#5af78e"
yellow  = "#f3f99d"
blue    = "#4a9eff"
magenta = "#ff6ac1"
cyan    = "#9aedfe"
white   = "#ffffff"

[cursor]
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 5000
